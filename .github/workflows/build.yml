# CI: собирает p2p-туннель (Linux x86_64) и Android APK с нативным .so.
# Релизы оригинала подписывались debug-ключом — здесь так же (assembleDebug).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tunnel-linux:
    name: opencode-tunnel (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build tunnel (release)
        run: cargo build --release --locked
        working-directory: tunnel
      - name: Stage binary
        run: |
          mkdir -p bridge/bin
          cp tunnel/target/release/opencode-tunnel bridge/bin/opencode-tunnel
      - uses: actions/upload-artifact@v5
        with:
          name: opencode-tunnel-linux-x86_64
          path: bridge/bin/opencode-tunnel

  apk:
    name: APK (aarch64 .so + assembleDebug)
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.3.11579264
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          gradle-home-cache-cleanup: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;26.3.11579264"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install bridge deps (нужны xterm-вендору для syncVendorAssets)
        run: npm ci --no-audit --no-fund
        working-directory: bridge

      - name: Build libopencode-tunnel.so (aarch64)
        run: |
          NDK=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/aarch64-linux-android26-clang
          export CC_aarch64_linux_android=$NDK/aarch64-linux-android26-clang
          export AR_aarch64_linux_android=$NDK/llvm-ar
          cargo build --release --locked --target aarch64-linux-android
        working-directory: tunnel

      - name: Stage .so into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp tunnel/target/aarch64-linux-android/release/opencode-tunnel \
             android/app/src/main/jniLibs/arm64-v8a/libopencode-tunnel.so

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v5
        with:
          name: opencode-bridge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.q.opencodebridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.q.opencodebridge"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // opencode-tunnel (iroh p2p) лежит в jniLibs как libopencode-tunnel.so и
    // запускается как процесс: для exec библиотека должна быть распакована
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Встроенный QR-сканер без Play Services: ZXing (чистый Java, лёгкий).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}

// Web-интерфейс вкладывается в APK и отдаётся локальным шлюзом:
// интерфейс приложения живёт даже при выключенном ПК.
tasks.register('syncWebAssets', Copy) {
    from '../../bridge/web'
    into 'src/main/assets/web'
}
tasks.register('syncVendorAssets', Copy) {
    from '../../bridge/node_modules/@xterm/xterm/lib/xterm.js',
         '../../bridge/node_modules/@xterm/xterm/css/xterm.css',
         '../../bridge/node_modules/@xterm/addon-fit/lib/addon-fit.js'
    into 'src/main/assets/web/vendor'
}
preBuild.dependsOn 'syncWebAssets', 'syncVendorAssets'

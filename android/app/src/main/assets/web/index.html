<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Defense in depth: even with a future injection bug, a script couldn't
     drag the token/microphone outside. Styles are inline (xterm injects its own),
     WS only to the app's local proxy port and to the bridge itself. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* wss://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
  <title>OpenCode Bridge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div id="tabs"></div>
    <div id="status">⚪</div>
    <button id="devBtn" title="Devices">⚙</button>
    <button id="newBtn" title="New session">＋</button>
  </header>

  <div id="banner" class="hidden"></div>

  <div id="selbar" class="hidden">
    <button id="selCopy">Copy</button>
    <button id="selCancel">Cancel</button>
  </div>

  <main id="termwrap">
    <div id="terminal"></div>
    <div id="placeholder">No active session.<br>Press ＋ to launch opencode.</div>
  </main>
  <button id="toBottom" class="hidden" title="To end">▼</button>

  <div id="voice" class="hidden">
    <div id="voiceMic">🎤</div>
    <div id="voiceTimer">0:00</div>
    <div id="voiceHint">Speak… release the button when done</div>
    <div id="voiceBtns" class="hidden">
      <button id="voiceCancel">Cancel</button>
      <button id="voiceAccept">Accept</button>
      <button id="voiceSend">Enter</button>
    </div>
  </div>

  <footer id="controls">
    <div id="keys">
      <button data-key="esc">Esc</button>
      <button data-key="tab">Tab</button>
      <button id="pasteBtn" title="Paste from clipboard">📋</button>
      <button data-key="up">↑</button>
      <button data-key="down">↓</button>
      <button data-key="left">←</button>
      <button data-key="right">→</button>
      <button data-key="enter">⏎</button>
      <button data-key="ctrlc">^C</button>
    </div>
    <div id="inputrow">
      <input id="msg" type="text" placeholder="Message for opencode…" autocomplete="off">
      <button id="send">➤</button>
    </div>
  </footer>

  <dialog id="devDialog">
    <h3>Trusted devices</h3>
    <div id="devList">Loading…</div>
    <div class="row">
      <button id="devClose">Close</button>
    </div>
  </dialog>

  <dialog id="newDialog">
    <h3>New session opencode</h3>
    <label>Project directory:</label>
    <select id="projectSel"></select>
    <input id="projectCustom" type="text" placeholder="…or your own path">
    <label class="chk"><input type="checkbox" id="optResume"> --continue (resume the last session)</label>
    <label class="chk"><input type="checkbox" id="optDanger"> --fork (branch a copy, needs --continue)</label>
    <div class="row">
      <button id="createOk">Launch</button>
      <button id="createCancel">Cancel</button>
    </div>
  </dialog>

  <script src="/vendor/xterm.js"></script>
  <script src="app.js"></script>
</body>
</html>
